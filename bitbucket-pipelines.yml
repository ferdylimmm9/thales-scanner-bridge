image: mcr.microsoft.com/dotnet/sdk:8.0

definitions:
  caches:
    nuget: ~/.nuget/packages
  steps:
    - step: &build-installer
        name: Build Windows installer
        caches:
          - nuget
        script:
          - apt-get update && apt-get install -y --no-install-recommends zip curl wine wine64 xvfb xauth
          - if [ -n "${BITBUCKET_TAG:-}" ]; then VERSION="${BITBUCKET_TAG#v}"; else VERSION="0.0.0-ci.${BITBUCKET_BUILD_NUMBER}"; fi
          - export WINEPREFIX="$BITBUCKET_CLONE_DIR/.wine-build" WINEDEBUG=-all
          - xvfb-run -a ./packaging/install-compiler.sh
          - export ISCC="$WINEPREFIX/drive_c/ThalesBuildTools/InnoSetup/ISCC.exe"
          - xvfb-run -a ./build-release.sh "$VERSION"
          - test -s ThalesBridgeSetup.exe
          - test -s publish.zip
          - test -s monitor-bridge.bat
        artifacts:
          - ThalesBridgeSetup.exe
          - publish.zip
          - monitor-bridge.bat

    - step: &build-qa-installer
        name: Build QA installer
        caches:
          - nuget
        script:
          - apt-get update && apt-get install -y --no-install-recommends zip curl wine wine64 xvfb xauth
          - VERSION="0.0.0-qa.${BITBUCKET_BUILD_NUMBER}"
          - export WINEPREFIX="$BITBUCKET_CLONE_DIR/.wine-build" WINEDEBUG=-all
          - xvfb-run -a ./packaging/install-compiler.sh
          - export ISCC="$WINEPREFIX/drive_c/ThalesBuildTools/InnoSetup/ISCC.exe"
          - xvfb-run -a ./build-release.sh "$VERSION"
          - test -s ThalesBridgeSetup.exe
          - test -s publish.zip
          - test -s monitor-bridge.bat
        artifacts:
          - ThalesBridgeSetup.exe
          - publish.zip
          - monitor-bridge.bat

pipelines:
  default:
    - step: *build-installer

  pull-requests:
    '**':
      - step: *build-installer

  branches:
    main:
      - step: *build-installer

    qa:
      - step: *build-qa-installer

  tags:
    'v*':
      - step: *build-installer
