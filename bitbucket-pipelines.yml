image: mcr.microsoft.com/dotnet/sdk:8.0

definitions:
  caches:
    nuget: ~/.nuget/packages
  steps:
    - step: &build-installer
        name: Build Windows installer
        caches:
          - nuget
        script:
          - apt-get update && apt-get install -y --no-install-recommends zip
          - if [ -n "${BITBUCKET_TAG:-}" ]; then VERSION="${BITBUCKET_TAG#v}"; else VERSION="0.0.0-ci.${BITBUCKET_BUILD_NUMBER}"; fi
          - ./build-release.sh "$VERSION"
          - test -s ThalesBridgeSetup.exe
          - test -s publish.zip
        artifacts:
          - ThalesBridgeSetup.exe
          - publish.zip

    - step: &build-qa-installer
        name: Build QA installer
        caches:
          - nuget
        script:
          - apt-get update && apt-get install -y --no-install-recommends zip
          - VERSION="0.0.0-qa.${BITBUCKET_BUILD_NUMBER}"
          - ./build-release.sh "$VERSION"
          - test -s ThalesBridgeSetup.exe
          - test -s publish.zip
        artifacts:
          - ThalesBridgeSetup.exe
          - publish.zip

pipelines:
  default:
    - step: *build-installer

  pull-requests:
    '**':
      - step: *build-installer

  branches:
    main:
      - step: *build-installer

    qa:
      - step: *build-qa-installer

  tags:
    'v*':
      - step: *build-installer
