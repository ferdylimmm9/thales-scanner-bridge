name: Build Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check transport regressions
        run: dotnet run --project tests/TransportChecks.csproj

      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./tests/Check-PowerShell.ps1

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = ./packaging/install-compiler.ps1
          "ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check installer integration scripts
        shell: pwsh
        run: |
          ./tests/Check-EndpointSwitch.ps1
          ./tests/Check-UninstallSettings.ps1
          ./tests/Check-StartupModes.ps1

      - name: Build Inno Setup installer
        shell: pwsh
        run: ./build-release.ps1 -Version "0.0.0-ci.$env:GITHUB_RUN_NUMBER"

      - name: Verify release files
        shell: bash
        run: |
          test -s ThalesBridgeSetup.exe
          test -s publish.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThalesBridgeSetup-${{ github.run_number }}
          path: |
            ThalesBridgeSetup.exe
            publish.zip
          if-no-files-found: error
          retention-days: 14
